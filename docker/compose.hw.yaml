# hw-mighty — the MIGHTY hardware autonomy stack in ONE container, host-tmux
# variant (sibling of the rover drive/sensors/dlio compose files): the container
# just IDLES (`sleep infinity`) and every node is a docker exec living in the
# HOST tmux session 'hw_mighty', built directly by mighty_hw.sh — the single
# entrypoint (run_hw_red_rover.py/tmuxp is the NATIVE `mighty` alias path only).
#
# The container must NEVER launch the session itself: when its command also ran
# run_hw_red_rover.py (pre-2026-07-30), every start produced TWO full stacks —
# an in-container session plus the host session — i.e. duplicate
# mighty/MPC/mapper nodes (two publishers on cmd_vel_auto).
#
#   build:   docker compose -f compose.hw.yaml build     (or: make hw-build)
#   up:      ./mighty_hw.sh start [--odom-type dlio|dlio_in_mocap|mocap]
#   attach:  tmux attach -t hw_mighty                     (HOST session)
#            (Ctrl-C / Up / Enter in a pane restarts just that node; Ctrl-b d detaches)
#   down:    ./mighty_hw.sh stop
#
# PREREQS: drive.service (hosts the zenoh router on :7447) and sensors.service
# (livox + D455 + base_link->lidar TF). This stack launches NO sensors and NO
# router — the nodes attach to the host router over network_mode: host. Do NOT
# run alongside the native `mighty` alias (double-publish), nor with
# dlio.service enabled (the DLIO panes here are the same nodes).
name: hw-mighty
services:
  hw-mighty:
    # Build context = /home/swarm/code (4 levels up from this docker/ dir) so the
    # image bakes the HOST checkouts of mighty_ws / decomp_ws / livox_ws /
    # Livox-SDK2 at their host paths. What ships is filtered by
    # Dockerfile.hw.dockerignore.
    build:
      context: ../../../..
      dockerfile: mighty_ws/src/mighty/docker/Dockerfile.hw
    image: mighty-hw:local
    container_name: hw-mighty
    network_mode: host            # share host net → reach the host rmw_zenohd on :7447
    # Identity + ROS transport come from the rover's provisioned env, exactly like
    # the drive/sensors/dlio siblings — nothing rover-specific in this directory.
    # Provides ROBOT_NAME/VEHTYPE/VEHNUM/ROS_DOMAIN_ID/RMW_IMPLEMENTATION and the
    # optional DLIO_SEED_Z. ZENOH_ROUTER_CONFIG_URI rides along harmlessly: no
    # router runs in this container, the nodes are plain zenoh sessions.
    env_file: /etc/rover/rover.env
    init: true
    stop_grace_period: 15s
    restart: "no"                 # manual stack; a dead pane stays dead (native semantics)
    # Idle keep-alive: the nodes are started from the HOST tmux 'hw_mighty'
    # session as docker execs (mighty_hw.sh start); the container only has to
    # stay up. The session builder runs on the host, so flag/pane changes need
    # no image rebuild.
    command: ["sleep", "infinity"]
